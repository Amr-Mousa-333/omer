<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | Omer</title>
    <style>
        :root {
            --primary: #0f0f0f;
            --secondary: #ff0055;
            --accent: #00ff88;
            --text: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: var(--primary);
            color: var(--text);
            overflow-x: hidden;
        }

        /* Header with Gradient Animation */
        .header {
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(
                45deg,
                var(--primary),
                var(--secondary),
                var(--accent),
                var(--primary)
            );
            background-size: 400% 400%;
            animation: gradientFlow 12s ease infinite;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .title {
            font-size: 4rem;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
            position: relative;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--accent);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .title:hover::after {
            transform: scaleX(1);
        }

        /* Video Section with Hover Effect */
        .video-trigger {
            position: relative;
            width: 80%;
            max-width: 800px;
            margin: 3rem auto;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .video-trigger:hover {
            transform: perspective(1000px) rotateX(3deg) rotateY(-3deg);
            box-shadow: 0 30px 60px rgba(255,0,85,0.3);
        }

        .video-trigger::before {
            content: '▶';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            color: white;
            opacity: 0.8;
            text-shadow: 0 0 20px var(--secondary);
            transition: all 0.3s ease;
        }

        .video-trigger:hover::before {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.2);
        }

        /* Fullscreen Video Overlay */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .video-overlay.active {
            display: flex;
            opacity: 1;
        }

        .video-overlay iframe {
            width: 90%;
            height: 80%;
            border: none;
            border-radius: 20px;
            box-shadow: 0 0 50px rgba(255,0,85,0.3);
        }

        .close-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-size: 2rem;
            cursor: pointer;
            color: var(--text);
            transition: transform 0.3s ease;
        }

        .close-btn:hover {
            transform: rotate(90deg);
            color: var(--secondary);
        }

        /* Advanced Audio Player */
        .audio-section {
            max-width: 600px;
            margin: 3rem auto;
            background: rgba(255,255,255,0.05);
            border-radius: 50px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s ease;
        }

        .audio-section:hover {
            transform: translateY(-5px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--secondary);
            border-radius: 4px;
        }

        /* Particle Background Effect */
        .particles {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <h1 class="title"> Omer Morshed</h1>
    </header>

    <!-- Video Section -->
    <div class="video-trigger" onclick="openVideo()">
        <img src="video-thumbnail.jpg" alt="Video Thumbnail" style="width:100%; height:auto;">
    </div>

    <!-- Fullscreen Video -->
    <div class="video-overlay" id="videoOverlay">
        <span class="close-btn" onclick="closeVideo()">✕</span>
        <iframe src="omerw.mp4" 
                allow="accelerometer; autoplay; encrypted-media; gyroscope" 
                allowfullscreen></iframe>
    </div>

    <!-- Audio Section -->
    <div class="audio-section">
        <audio controls style="width:100%;">
            <source src="omer.MP3.mp3" type="audio/mpeg">
            المتصفح لا يدعم تشغيل الصوت
        </audio>
    </div>

    <script>
        // Video Controls
        function openVideo() {
            document.getElementById('videoOverlay').classList.add('active');
        }

        function closeVideo() {
            document.getElementById('videoOverlay').classList.remove('active');
        }

        // Close video when clicking outside
        document.querySelector('.video-overlay').addEventListener('click', (e) => {
            if (e.target === document.querySelector('.video-overlay')) {
                closeVideo();
            }
        });

        // Parallax Effect
        document.addEventListener('mousemove', (e) => {
            const videoTrigger = document.querySelector('.video-trigger');
            const x = (window.innerWidth - e.pageX * 0.5) / 100;
            const y = (window.innerHeight - e.pageY * 0.5) / 100;
            videoTrigger.style.transform = `perspective(1000px) rotateX(${y}deg) rotateY(${-x}deg)`;
        });
    </script>
</body>
</html>
